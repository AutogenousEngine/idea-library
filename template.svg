<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Idea Library: ideas in chapters, connected, each backed by a quote">
  <rect width="240" height="160" rx="12" fill="#f7f6f0"/>
  <rect x="0.5" y="0.5" width="239" height="159" rx="11.5" fill="none" stroke="#dedfd4"/>
  <!-- top bar -->
  <rect x="14" y="13" width="9" height="9" rx="2.5" fill="#97630c"/>
  <text x="28" y="21" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#252e28">Idea Library</text>
  <rect x="140" y="15" width="22" height="4" rx="2" fill="#7a2e3a"/>
  <rect x="168" y="15" width="22" height="4" rx="2" fill="#c9c6b8"/>
  <rect x="196" y="15" width="22" height="4" rx="2" fill="#c9c6b8"/>
  <line x1="14" y1="32" x2="226" y2="32" stroke="#dedfd4"/>
  <!-- connections: solid = expressed, dashed = suggested -->
  <g stroke="#8a8f84" stroke-width="1.4" fill="none">
    <line x1="40" y1="62" x2="78" y2="52"/>
    <line x1="78" y1="52" x2="98" y2="88"/>
    <line x1="40" y1="62" x2="56" y2="104"/>
    <line x1="56" y1="104" x2="98" y2="88"/>
    <line x1="98" y1="88" x2="126" y2="122"/>
    <line x1="56" y1="104" x2="34" y2="134"/>
  </g>
  <g stroke="#8a8f84" stroke-width="1.4" stroke-dasharray="3 3" fill="none">
    <line x1="78" y1="52" x2="124" y2="60"/>
    <line x1="124" y1="60" x2="126" y2="122"/>
    <line x1="34" y1="134" x2="126" y2="122"/>
  </g>
  <!-- ideas, coloured by chapter -->
  <circle cx="40" cy="62" r="8" fill="#254f3b"/>
  <circle cx="78" cy="52" r="10" fill="#97630c"/>
  <circle cx="98" cy="88" r="12" fill="#7a2e3a" stroke="#f7f6f0" stroke-width="2"/>
  <circle cx="98" cy="88" r="15" fill="none" stroke="#7a2e3a" stroke-width="1.2"/>
  <circle cx="56" cy="104" r="9" fill="#254f3b"/>
  <circle cx="124" cy="60" r="7" fill="#3f6c8f"/>
  <circle cx="126" cy="122" r="9" fill="#97630c"/>
  <circle cx="34" cy="134" r="7" fill="#3f6c8f"/>
  <!-- the selected idea and its quote -->
  <rect x="146" y="44" width="80" height="102" rx="7" fill="#ffffff" stroke="#dedfd4"/>
  <rect x="154" y="53" width="40" height="4" rx="2" fill="#7a2e3a"/>
  <rect x="154" y="63" width="62" height="6" rx="3" fill="#252e28"/>
  <rect x="154" y="73" width="48" height="6" rx="3" fill="#252e28"/>
  <rect x="154" y="88" width="3" height="28" rx="1.5" fill="#97630c"/>
  <rect x="162" y="89" width="54" height="4" rx="2" fill="#ead7ad"/>
  <rect x="162" y="97" width="50" height="4" rx="2" fill="#ead7ad"/>
  <rect x="162" y="105" width="56" height="4" rx="2" fill="#ead7ad"/>
  <rect x="162" y="113" width="34" height="4" rx="2" fill="#ead7ad"/>
  <circle cx="158" cy="132" r="4" fill="none" stroke="#73796f" stroke-width="1.2"/>
  <path d="M156.6 130.4 L160.2 132 L156.6 133.6 Z" fill="#73796f"/>
  <rect x="166" y="130" width="36" height="4" rx="2" fill="#c9c6b8"/>
</svg>

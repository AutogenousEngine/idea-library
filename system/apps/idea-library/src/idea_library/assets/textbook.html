<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Idea Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--paper:#f7f5ef;--paper2:#f1eee4;--ink:#201f1c;--muted:#8c8577;--rule:#dbd6c7;--garnet:#7b2d3a;--garnet-soft:#f0e3e2;--gold:#9a7a2e;--gold-soft:#f7efdb;--slate:#4a5a6a;--slate-soft:#e5e9ec;--top:56px}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:calc(var(--top) + 16px)}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 Newsreader,Georgia,serif}
.topbar{position:sticky;top:0;z-index:5;height:var(--top);display:flex;align-items:center;gap:20px;padding:0 28px;background:var(--paper);border-bottom:1px solid var(--rule)}
.brand{font:600 17px Fraunces,serif;margin-right:8px;white-space:nowrap}
.tabs{display:flex;gap:4px}.tab{border:0;background:none;padding:8px 12px;font:500 12px/1.2 "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;text-align:left}
.tab small{display:block;text-transform:none;letter-spacing:0;font:italic 13px Newsreader,serif;margin-top:2px}.tab.on{color:var(--garnet);border-color:var(--garnet)}.tab:hover{color:var(--ink)}
.tl{font:500 11px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;white-space:nowrap}.tl:hover{color:var(--garnet)}.search{margin-left:auto;display:flex;align-items:center;gap:8px}.search input{width:260px;border:1px solid var(--rule);background:var(--paper2);padding:7px 10px;font:15px Newsreader,serif;color:var(--ink);border-radius:2px}
.search button{border:0;background:none;color:var(--muted);font:12px "IBM Plex Mono",monospace;cursor:pointer}
.wrap{display:grid;grid-template-columns:288px minmax(0,1fr);max-width:1260px;margin:0 auto}
main{padding:40px 48px 120px;max-width:860px}
.rail{position:sticky;top:var(--top);align-self:start;height:calc(100vh - var(--top));overflow:auto;border-right:1px solid var(--rule);padding:28px 24px 40px;display:flex;flex-direction:column;gap:18px}
.rail-title{font:500 10px "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.toc{display:flex;flex-direction:column;gap:2px}
.rail a{display:flex;gap:12px;align-items:baseline;padding:6px 8px;margin:0 -8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:16px;line-height:1.22}
.rail a:hover{background:var(--paper2);color:var(--garnet)}
.rail a .n{font:500 11px "IBM Plex Mono",monospace;color:var(--muted);min-width:26px}
.rail a small{display:block;font:9.5px "IBM Plex Mono",monospace;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.rail a.on{color:var(--garnet);background:var(--garnet-soft)}.rail a.dim{opacity:.35}
.legend{display:flex;flex-direction:column;gap:8px;font:10.5px/1.4 "IBM Plex Mono",monospace;color:var(--muted);border-top:1px solid var(--rule);padding-top:16px}
.kicker{font:500 11px "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--garnet)}
h1{font:500 42px/1.1 Fraunces,serif;margin:10px 0 14px;letter-spacing:-.01em}.lede{font:italic 21px/1.45 Newsreader,serif;margin:0 0 14px}
.note{color:var(--muted);font-size:15px;margin:0 0 6px}.stat{margin:22px 0 8px;padding:10px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font:12px "IBM Plex Mono",monospace;color:var(--muted);letter-spacing:.04em}
.sec{margin-top:54px}.sec-head{display:flex;gap:16px;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:10px;margin-bottom:6px}
.sec-n{font:500 13px "IBM Plex Mono",monospace;color:var(--garnet)}.sec-title{font:500 28px Fraunces,serif;margin:0}.sec-sub{margin:0 0 0 auto;font:italic 15px Newsreader,serif;color:var(--muted);text-align:right}
.blurb{color:var(--muted);font-size:15px;margin:8px 0 14px}
details.entry{border-bottom:1px solid var(--rule)}details.entry>summary{list-style:none;cursor:pointer;padding:16px 0;display:grid;gap:4px}details.entry>summary::-webkit-details-marker{display:none}
.etype{font:500 10.5px "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--slate)}.etype.seed{color:var(--gold)}
.etitle{font:500 20px/1.3 Fraunces,serif}.esum{color:#4a4840;font-size:16px}details[open]>summary .esum{display:none}.hint{font:12px "IBM Plex Mono",monospace;color:var(--muted)}details[open] .hint .p{display:inline-block;transform:rotate(45deg)}
details.entry:hover .etitle{color:var(--garnet)}details.entry.target{background:linear-gradient(90deg,var(--gold-soft),transparent 70%);box-shadow:-12px 0 0 var(--gold-soft)}
.body{padding:2px 0 22px}.body h4{margin:18px 0 6px;font:500 11px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.q{margin:8px 0;padding:6px 0 6px 16px;border-left:3px solid var(--rule);font-style:italic}.q cite{display:block;font:normal 13px Newsreader,serif;color:var(--muted);margin-top:2px}
.links{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;font-size:15px}.links li{display:block}.sg{display:inline-block;margin-left:6px;padding:0 6px;border:1px dashed #c9b98a;border-radius:2px;font:11px/1.6 "IBM Plex Mono",monospace;color:var(--gold);vertical-align:1px;white-space:nowrap}.links a,.body a{color:var(--garnet)}
.essay-seed{background:var(--gold-soft);border:1px solid #e8d9a8;padding:10px 14px;border-radius:2px;margin-top:12px;font-size:15.5px}
.atlas{display:inline-block;margin-top:16px;font:12px "IBM Plex Mono",monospace;text-decoration:none;border:1px solid var(--rule);padding:5px 9px;color:var(--ink)}.atlas:hover{border-color:var(--garnet);color:var(--garnet)}
details.raw summary{cursor:pointer;color:var(--muted);font:12px "IBM Plex Mono",monospace;margin-top:12px}details.about summary{color:var(--garnet)}details.about .note{margin-top:8px}details.raw pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 "IBM Plex Mono",monospace;background:var(--paper2);padding:12px;max-height:340px;overflow:auto}
mark{background:#f3dd9a;color:inherit;padding:0 1px}.empty{padding:40px 0;color:var(--muted);font-style:italic}
.footer{margin-top:60px;color:var(--muted);font-size:14px;border-top:1px solid var(--rule);padding-top:14px}
.search input:focus~kbd,.search input:not(:placeholder-shown)~kbd{display:none}.search kbd{font:11px "IBM Plex Mono",monospace;color:var(--muted);border:1px solid var(--rule);border-radius:2px;padding:0 5px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}main{padding:28px 20px 90px}.rail{display:none}.tab small{display:none}.search input{width:180px}}
@media(max-width:640px){.topbar{height:auto;flex-wrap:wrap;gap:6px 12px;padding:10px 16px}.tabs{order:3;width:100%;overflow-x:auto;margin:0 -8px}.tab{padding:6px 8px;flex:none}.search{flex:1;min-width:0}.search input{width:100%;min-width:0}.search kbd{display:none}.wrap{padding:24px 18px 90px}h1{font-size:32px}.lede{font-size:19px}.sec{margin-top:40px}.sec-head{flex-wrap:wrap;gap:4px 12px}.sec-title{font-size:24px}.sec-sub{margin:0;text-align:left;flex-basis:100%}.etitle{font-size:19px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body>
<div class="topbar"><div class="brand">Idea Library</div>
<div class="tabs" role="tablist"><button class="tab on" data-v="chapters" role="tab">Chapters<small>the reading order</small></button><button class="tab" data-v="threads" role="tab">Threads<small>how ideas connect</small></button><button class="tab" data-v="sources" role="tab">Sources<small>where each idea came from</small></button></div>
<a class="tl" href="graph.html">Graph</a><a class="tl" href="map.html">Idea map</a><a class="tl" href="classic.html">Classic view</a>
<div class="search"><input id="q" type="search" placeholder="Search this view…" aria-label="Search this view"><kbd title="Press / to search">/</kbd><button id="clear" hidden>Clear</button></div></div>
<div class="wrap"><nav class="rail" id="rail" aria-label="Contents"></nav><main id="main"></main></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D,N,S,view='chapters',byId={},srcById={},conn={},seen=new Set();
const SUBS={};const chapterOrder=d=>{const o=(d.chapters||[]).map(c=>c.name);d.nodes.forEach(n=>{if(!o.includes(n.group))o.push(n.group)});return o};
const BLURB={};
Promise.all([fetch('map-data.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()})]).then(([d])=>{
 (d.chapters||[]).forEach(c=>{if(c.subtitle)SUBS[c.name]=c.subtitle});D=d;N=d.nodes;S=d.sources;N.forEach(n=>byId[n.id]=n);S.forEach(s=>srcById[s.id]=s);
 N.forEach(n=>conn[n.id]=[]);d.edges.forEach(e=>{conn[e.source]?.push({to:e.target,label:e.label,dir:'out',e});conn[e.target]?.push({to:e.source,label:e.label,dir:'in',e})});
 document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{view=t.dataset.v;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));render();if(byId[decodeURIComponent(location.hash.slice(1))])openHash();else scrollTo({top:0})});
 $('q').oninput=render;$('clear').onclick=()=>{$('q').value='';render();$('q').focus()};
 document.addEventListener('keydown',e=>{const t=e.target,typing=t.closest&&t.closest('input,textarea,select,[contenteditable]');
  if(e.key==='/'&&!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();$('q').focus();$('q').select()}
  else if(e.key==='Escape'&&t===$('q')){e.preventDefault();if($('q').value){$('q').value='';render()}else $('q').blur()}});
 window.addEventListener('hashchange',()=>openHash());
 new ResizeObserver(es=>document.documentElement.style.setProperty('--top',es[0].target.getBoundingClientRect().height+'px')).observe(document.querySelector('.topbar'));
 render();openHash()}).catch(e=>{$('main').innerHTML='<div class="empty" id="load-error">'+(e&&e.message==='404'?'No library yet. Ask your agent to build your Idea Library from your writing and recordings.':'The library could not load. Refresh to try again.')+'</div>'});
function openHash(smooth){const h=decodeURIComponent(location.hash.slice(1));if(!h||!byId[h])return;let el=document.getElementById('e-'+h);
 if(!el&&$('q').value){$('q').value='';render();el=document.getElementById('e-'+h)}
 if(!el)return;document.querySelectorAll('details.entry.target').forEach(x=>x.classList.remove('target'));el.open=true;el.classList.add('target');requestAnimationFrame(()=>el.scrollIntoView({block:'start',behavior:smooth?'smooth':'instant'}))}
function entry(n,ctx){const ev=(n.evidence||[]).map(x=>{const s=srcById[x.source_id];return `<div class="q">“${esc(x.quote)}”<cite>${s?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`:esc(x.source_id)}</cite></div>`}).join('');
 const cs=[...conn[n.id]].sort((a,b)=>(a.dir==='out'?0:1)-(b.dir==='out'?0:1)).map(c=>{const t=esc(byId[c.to]?.title||c.to),a=`<a href="#${esc(c.to)}" data-goto="${esc(c.to)}">${t}</a>`,sg=c.e.basis==='suggested'?'<span class="sg" title="An interpretation, not stated in the source">suggested link</span>':'';return `<li>${c.dir==='out'?`This ${esc(c.label)} ${a}`:`${a} ${esc(c.label)} this`}${sg}</li>`}).join('');
 const srcs=[...new Set((n.evidence||[]).map(x=>x.source_id))].map(id=>srcById[id]).filter(Boolean).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join('');
 const first=!seen.has(n.id);seen.add(n.id);return `<details class="entry"${first?` id="e-${esc(n.id)}"`:''} data-idea="${esc(n.id)}" data-text="${esc([n.title,n.summary,n.writing_seed,n.group].join(' ').toLowerCase())}"><summary><span class="etype ${n.writing_seed?'seed':''}">${n.writing_seed?'Idea · essay seed':'Idea'}</span><span class="etitle">${esc(n.title)}</span><span class="esum">${esc(n.summary)}</span><span class="hint">Read more <span class="p">+</span></span></summary><div class="body"><p>${esc(n.summary)}</p>${n.writing_seed?`<div class="essay-seed"><b>Essay seed.</b> ${esc(typeof n.writing_seed==='string'?n.writing_seed:JSON.stringify(n.writing_seed))}</div>`:''}${ev?`<h4>In their words</h4>${ev}`:''}${cs?`<h4>Connected to</h4><ul class="links">${cs}</ul>`:''}${srcs?`<h4>Sources</h4><ul class="links">${srcs}</ul>`:''}<a class="atlas" href="map.html#${encodeURIComponent(n.id)}">View on the idea map</a></div></details>`}
const ideas=k=>k+(k===1?' idea':' ideas'),txt=(n,...x)=>[n.title,n.summary,n.group,typeof n.writing_seed==='string'?n.writing_seed:'',...(n.evidence||[]).map(e=>e.quote),...x].join(' ').toLowerCase();
function head(kick,title,lede,notes){return `<div class="kicker">${kick}</div><h1>${title}</h1><p class="lede">${lede}</p>${notes}`}
function render(){const q=$('q').value.trim().toLowerCase();$('clear').hidden=!q;let html='',rail='',shown=0;seen=new Set();
 const intro=head('Personal idea library · '+({chapters:'Chapters',threads:'Threads',sources:'Sources'})[view],D.author?D.author+'’s collected thinking':'Collected thinking',({chapters:D.reading_intro||'Read in order, chapter by chapter.',threads:'Every idea, with the other ideas it leans on or leads to.',sources:'Start from an article or recording and see what it gave rise to.'})[view],`<details class="raw about"><summary>About this collection</summary><p class="note">${esc(D.scope||'')}</p></details>`);
 if(view==='chapters'){const groups=chapterOrder(D);groups.forEach((g,i)=>{const items=N.filter(n=>n.group===g&&(!q||txt(n).includes(q)));shown+=items.length;
   rail+=`<a href="#c${i}" class="${items.length?'':'dim'}"><span class="n">${i+1}</span><span>${esc(g)}<small>${esc(SUBS[g]||'')} · ${ideas(items.length)}</small></span></a>`;
   if(items.length)html+=`<section class="sec" id="c${i}"><div class="sec-head"><span class="sec-n">${i+1}</span><h2 class="sec-title">${esc(g)}</h2><p class="sec-sub">${esc(SUBS[g]||'')}</p></div>${items.map(n=>entry(n)).join('')}</section>`})}
 if(view==='threads'){const ranked=[...N].sort((a,b)=>conn[b.id].length-conn[a.id].length).filter(n=>!q||txt(n).includes(q));shown=ranked.length;rail=`<a href="#t0" class="on"><span class="n">·</span><span>Most connected first<small>${ideas(ranked.length)}</small></span></a>`;html=`<section class="sec" id="t0"><div class="sec-head"><h2 class="sec-title">Most connected first</h2><p class="sec-sub">${D.edges.length} connections</p></div>${ranked.map(n=>entry(n)).join('')}</section>`}
 if(view==='sources'){S.forEach((s,i)=>{const items=N.filter(n=>(n.evidence||[]).some(x=>x.source_id===s.id)&&(!q||txt(n,s.title).includes(q)));if(!items.length&&!(q&&s.title.toLowerCase().includes(q)))return;shown+=items.length;
   rail+=`<a href="#s${i}"><span class="n">${i+1}</span><span>${esc(s.title)}<small>${esc(s.kind||'')} · ${ideas(items.length)}</small></span></a>`;
   html+=`<section class="sec" id="s${i}"><div class="sec-head"><span class="sec-n">${i+1}</span><h2 class="sec-title" style="font-size:22px">${esc(s.title)}</h2><p class="sec-sub">${esc(s.kind||'')}</p></div><p class="blurb"><a href="${esc(s.url)}" target="_blank" rel="noopener">Open the original</a></p>${items.map(n=>entry(n)).join('')}<details class="raw"><summary>Show the original text</summary><pre>${esc(s.raw||'')}</pre></details></section>`})}
 $('rail').innerHTML=`<div class="rail-title">${({chapters:'The spine · reading order',threads:'Threads · most connected first',sources:'Sources · articles and recordings'})[view]}</div><div class="toc">${rail}</div><div class="legend"><div>Quotes are the person’s own words.</div><div>Suggested links are interpretations, not facts.</div><div>Every idea links to where it came from.</div></div>`;
 $('main').innerHTML=intro+`<div class="stat">${N.length} ideas · ${D.edges.length} connections · ${S.length} sources${q?` · ${shown} match “${esc(q)}”`:''}</div>`+(html||'<div class="empty">Nothing matches that search in this view.</div>')+`<p class="footer">${esc(D.disclaimer||'')}</p>`;
 if(q)highlight($('main'),q);spy();bind()}
function highlight(root,q){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.trim()&&!n.parentElement.closest('script,style,pre,.stat,.footer')&&n.nodeValue.toLowerCase().includes(q)?1:2});const ns=[];for(let n=w.nextNode();n;n=w.nextNode())ns.push(n);
 ns.forEach(n=>{const t=n.nodeValue,l=t.toLowerCase(),f=document.createDocumentFragment();let s=0,m;while((m=l.indexOf(q,s))>-1){f.append(t.slice(s,m));const k=document.createElement('mark');k.textContent=t.slice(m,m+q.length);f.append(k);s=m+q.length}f.append(t.slice(s));n.replaceWith(f)});
 root.querySelectorAll('details.entry:has(mark)').forEach(d=>{if(root.querySelectorAll('details.entry:has(mark)').length<=6)d.open=true})}
function bind(){document.querySelectorAll('[data-goto]').forEach(a=>a.onclick=e=>{e.preventDefault();const el=document.getElementById('e-'+a.dataset.goto);if(el){history.replaceState(null,'','#'+a.dataset.goto);openHash(true)}})}
let io;function spy(){io?.disconnect();const links=[...document.querySelectorAll('#rail a')];if(view==='threads')return;io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle('on',l.getAttribute('href')==='#'+e.target.id))}})},{rootMargin:'-20% 0px -70% 0px'});document.querySelectorAll('main .sec').forEach(s=>io.observe(s))}
</script></body></html>

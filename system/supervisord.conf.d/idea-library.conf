[program:idea-library]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/forward_port.py --manifest system/apps/idea-library/app.toml --url http://localhost:8093 && exec idea-library"
directory=/home/user/workspace
autostart=true
autorestart=true
startsecs=30
startretries=5
stdout_logfile=/var/log/supervisor/idea-library-stdout.log
stderr_logfile=/var/log/supervisor/idea-library-stderr.log
